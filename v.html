<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON OVERDRIVE • APEX V33 • 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg: #020204;
            --surface: #0a0a0f;
            --surface-alt: #12121a;
            --accent: #00f3ff;
            --accent-dim: rgba(0, 243, 255, 0.15);
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-yellow: #fcee0a;
            --text-main: #f0f0f0;
            --text-dim: #777;
            --font-mono: 'Fira Code', monospace;
            --font-sans: 'Inter', sans-serif;
            --glow: 0 0 15px rgba(0, 243, 255, 0.4);
            --glow-pink: 0 0 15px rgba(255, 0, 255, 0.4);
            --border-radius: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            background: var(--bg); color: var(--text-main); font-family: var(--font-sans);
            overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
        }

        body::before {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-alt); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

        ::selection { background: var(--neon-pink); color: #000; }

        .container { max-width: 1600px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; position: relative; z-index: 10; }

        header {
            display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px;
            border-bottom: 2px solid var(--accent); padding-bottom: 15px; margin-bottom: 25px;
        }

        .logo-group h1 {
            font-family: var(--font-mono); font-size: clamp(20px, 5vw, 28px); color: var(--accent);
            text-shadow: var(--glow); letter-spacing: 3px; font-weight: 900; user-select: none;
            animation: glitch 2s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 var(--neon-red), -0.03em -0.04em 0 var(--neon-green), 0.025em 0.04em 0 var(--neon-pink); }
            15% { text-shadow: 0.05em 0 0 var(--neon-red), -0.03em -0.04em 0 var(--neon-green), 0.025em 0.04em 0 var(--neon-pink); }
            16% { text-shadow: -0.05em 0 0 var(--neon-red), 0.025em 0.035em 0 var(--neon-green), -0.05em -0.05em 0 var(--neon-pink); }
            49% { text-shadow: -0.05em 0 0 var(--neon-red), 0.025em 0.035em 0 var(--neon-green), -0.05em -0.05em 0 var(--neon-pink); }
            50% { text-shadow: 0.05em 0.035em 0 var(--neon-red), 0.03em 0 0 var(--neon-green), 0 -0.04em 0 var(--neon-pink); }
            99% { text-shadow: 0.05em 0.035em 0 var(--neon-red), 0.03em 0 0 var(--neon-green), 0 -0.04em 0 var(--neon-pink); }
            100% { text-shadow: -0.05em 0 0 var(--neon-red), -0.025em -0.04em 0 var(--neon-green), -0.04em 0.04em 0 var(--neon-pink); }
        }

        .stats-bar { font-family: var(--font-mono); font-size: 11px; display: flex; gap: 20px; color: var(--text-dim); }
        .stats-bar span b { color: var(--accent); }

        .controls-panel {
            background: var(--surface); padding: 20px; border: 1px solid var(--accent-dim);
            border-radius: var(--border-radius); display: grid; grid-template-columns: 1fr auto auto auto; gap: 15px;
            margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
        }

        .suggest-box { position: relative; grid-column: 1; }

        .suggestions {
            position: absolute; top: calc(100% + 5px); left: 0; width: 100%;
            background: var(--surface); border: 1px solid var(--accent-dim); max-height: 200px;
            overflow-y: auto; z-index: 100; border-radius: var(--border-radius);
        }

        .suggest-item {
            padding: 10px 15px; cursor: pointer; font-family: var(--font-mono); font-size: 14px;
            border-bottom: 1px solid #222; transition: background 0.2s;
        }

        .suggest-item:hover { background: var(--accent-dim); color: var(--accent); }

        input, select, button {
            background: #000; color: var(--text-main); border: 1px solid var(--text-dim);
            padding: 12px 18px; font-family: var(--font-mono); font-size: 14px;
            border-radius: 2px; transition: all 0.2s ease;
        }

        input:focus, select:focus { border-color: var(--accent); box-shadow: var(--glow); }

        button {
            cursor: pointer; font-weight: 700; text-transform: uppercase; border-color: var(--accent); color: var(--accent);
            display: flex; align-items: center; justify-content: center; gap: 8px; user-select: none;
        }

        button:hover { background: var(--accent); color: #000; box-shadow: var(--glow); }
        button:active { transform: scale(0.97); }
        button.pink { border-color: var(--neon-pink); color: var(--neon-pink); }
        button.pink:hover { background: var(--neon-pink); color: #000; box-shadow: var(--glow-pink); }

        .tab-system { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid #222; overflow-x: auto; padding-bottom: 1px; }
        .tab { 
            padding: 10px 25px; cursor: pointer; color: var(--text-dim); font-family: var(--font-mono);
            font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap;
            transition: all 0.2s;
        }
        .tab:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-dim); }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px;
        }

        .card {
            background: var(--surface); border: 1px solid #1a1a25; border-radius: var(--border-radius);
            overflow: hidden; position: relative; display: flex; flex-direction: column;
            animation: fadeIn 0.4s ease-out; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: var(--glow); }

        .thumb-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #050505; overflow: hidden; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .card:hover .thumb-box img { transform: scale(1.08); }

        .tag {
            position: absolute; top: 10px; right: 10px; padding: 3px 8px; 
            font-size: 10px; font-family: var(--font-mono); background: rgba(0,0,0,0.8);
            border: 1px solid var(--accent); color: var(--accent);
        }

        .duration {
            position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.85);
            padding: 2px 6px; font-size: 11px; font-family: var(--font-mono); color: var(--neon-green);
        }

        .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 12px; height: 40px; overflow: hidden; }
        
        .card-footer { display: flex; gap: 8px; }
        .card-footer button { flex: 1; font-size: 11px; padding: 8px; }

        .console {
            background: #000; border-top: 2px solid var(--neon-green); height: 160px;
            padding: 10px; font-family: var(--font-mono); font-size: 12px; overflow-y: auto;
            color: #ccc; flex-shrink: 0;
        }
        .console p { margin-bottom: 4px; line-height: 1.2; }
        .log-info { color: var(--accent); }
        .log-warn { color: var(--neon-yellow); }
        .log-err { color: var(--neon-red); }
        .log-sys { color: var(--neon-green); }
        .log-success { color: var(--neon-green); }

        .loader { width: 40px; height: 40px; border: 3px solid #111; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 50px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        .status-msg { text-align: center; padding: 100px 0; color: var(--text-dim); font-family: var(--font-mono); }

        .tab-controls { margin-bottom: 15px; text-align: right; }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--accent);
            color: var(--accent); padding: 15px 25px; border-radius: 4px; z-index: 10000;
            font-family: var(--font-mono); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease-out;
        }

        @media (max-width: 800px) {
            .controls-panel { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
            .suggest-box { grid-column: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-group">
            <h1>NEON OVERDRIVE</h1>
            <div class="stats-bar">
                <span>MEM: <b id="mem-stat">0MB</b></span>
                <span>NODES: <b id="node-stat">0</b></span>
                <span>LATENCY: <b id="lat-stat">0ms</b></span>
            </div>
        </div>
        <div style="color: var(--neon-pink); font-family: var(--font-mono); font-size: 12px;">CORE_V3.3.0_2026</div>
    </header>

    <div class="controls-panel">
        <div class="suggest-box">
            <input type="text" id="queryInput" placeholder="ENTER SEARCH_STRING..." autocomplete="off" autofocus>
            <div id="suggestions" class="suggestions hidden"></div>
        </div>
        <select id="networkSelect">
            <option value="pornhub">PH_NETWORK</option>
            <option value="redtube">RT_LEGACY</option>
            <option value="thumbzilla">TZ_MOBILE</option>
            <option value="youporn">YP_CORE</option>
            <option value="youtube">YT_SAFE</option>
        </select>
        <button id="searchBtn">INITIALIZE SCAN</button>
        <button class="pink" id="clearBtn">PURGE</button>
    </div>

    <div class="tab-system" id="tabSystem">
        <div class="tab active" data-view="grid">DATA_GRID</div>
        <div class="tab" data-view="history">SCAN_HISTORY</div>
        <div class="tab" data-view="favs">VAULT</div>
    </div>

    <div id="grid-view">
        <div id="mainGrid" class="grid"></div>
        <button id="loadMore" class="hidden" style="margin: 20px auto; display: block;">SUMMON MORE NODES</button>
        <div id="loader" class="loader hidden"></div>
        <div id="emptyMsg" class="status-msg">SYSTEM IDLE... AWAITING UPLINK.</div>
    </div>

    <div id="history-view" class="hidden">
        <div class="tab-controls">
            <button class="pink" id="clearHistBtn">PURGE HISTORY</button>
        </div>
        <div id="historyList"></div>
    </div>

    <div id="favs-view" class="hidden">
        <div class="tab-controls">
            <button class="pink" id="clearFavBtn">PURGE VAULT</button>
        </div>
        <div id="favsGrid" class="grid"></div>
    </div>
</div>

<div class="console" id="console">
    <p class="log-sys">[SYS] NEON CORE AWAKENED.</p>
    <p class="log-info">[INFO] V33 ENHANCEMENTS: SECURITY PATCHES, PERFORMANCE RUNES, UI FLUX CALIBRATED.</p>
</div>

<script>
    'use strict';

    const Core = {
        config: {
            proxy: 'https://api.allorigins.win/get?url=',
            perPage: 24,
            engines: {
                pornhub: {
                    base: 'https://www.pornhub.com/video/search?search=',
                    pageParam: '&page=',
                    selectors: { item: '.pcVideoListItem, li.videoblock', title: '.title a, .video-title a', link: 'a', duration: '.duration, .video-duration', thumb: 'img' }
                },
                redtube: {
                    base: 'https://www.redtube.com/?search=',
                    pageParam: '&page=',
                    selectors: { item: 'li.videoblock, .video-block', title: '.video-title a, a', link: 'a', duration: '.duration', thumb: 'img' }
                },
                thumbzilla: {
                    base: 'https://www.thumbzilla.com/video/search?q=',
                    pageParam: '&page=',
                    selectors: { item: '.js-videoThumb, .video-item', title: '.title, a', link: 'a', duration: '.duration', thumb: 'img' }
                },
                youporn: {
                    base: 'https://www.youporn.com/search/?query=',
                    pageParam: '&page=',
                    selectors: { item: '.video-box, .teaser-video', title: '.video-title, a', link: 'a', duration: '.duration', thumb: 'img' }
                },
                youtube: {
                    base: 'https://www.youtube.com/results?search_query=',
                    pageParam: '', 
                    selectors: { item: 'ytd-video-renderer', title: '#video-title', link: '#video-title', duration: '#time-status span', thumb: '#img' }
                }
            }
        },

        dom: {},
        state: {
            history: [],
            favs: [],
            results: [],
            isSearching: false,
            currentQuery: '',
            currentEngine: '',
            currentPage: 1
        },

        init() {
            this.cacheDom();
            this.loadState();
            this.bindEvents();
            this.renderHistory();
            this.renderFavs();
            this.updateStats();
            this.log('Ethereal subsystems online.', 'sys');
            this.startMemMonitor();
            
            if (this.state.history.length === 0) {
                 this.state.history = ['initialization_rune', 'void_scan'];
                 this.saveState();
            }
        },

        cacheDom() {
            this.dom = {
                queryInput: document.getElementById('queryInput'),
                suggestions: document.getElementById('suggestions'),
                networkSelect: document.getElementById('networkSelect'),
                searchBtn: document.getElementById('searchBtn'),
                clearBtn: document.getElementById('clearBtn'),
                mainGrid: document.getElementById('mainGrid'),
                loader: document.getElementById('loader'),
                loadMore: document.getElementById('loadMore'),
                emptyMsg: document.getElementById('emptyMsg'),
                console: document.getElementById('console'),
                historyList: document.getElementById('historyList'),
                favsGrid: document.getElementById('favsGrid'),
                clearHistBtn: document.getElementById('clearHistBtn'),
                clearFavBtn: document.getElementById('clearFavBtn'),
                tabSystem: document.getElementById('tabSystem'),
                memStat: document.getElementById('mem-stat'),
                nodeStat: document.getElementById('node-stat'),
                latStat: document.getElementById('lat-stat')
            };
        },

        bindEvents() {
            this.dom.searchBtn.addEventListener('click', () => this.search());
            this.dom.clearBtn.addEventListener('click', () => this.clear());
            this.dom.clearHistBtn.addEventListener('click', () => this.clearHistory());
            this.dom.clearFavBtn.addEventListener('click', () => this.clearFavs());
            this.dom.loadMore.addEventListener('click', () => this.loadMore());
            
            this.dom.queryInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') this.search();
            });

            let debounceTimer;
            this.dom.queryInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => this.showSuggestions(e.target.value), 200);
            });

            this.dom.queryInput.addEventListener('blur', () => {
                setTimeout(() => this.dom.suggestions.classList.add('hidden'), 150);
            });

            this.dom.tabSystem.addEventListener('click', (e) => {
                if (e.target.classList.contains('tab')) {
                    this.setTab(e.target.dataset.view, e.target);
                }
            });

            this.dom.mainGrid.addEventListener('click', (e) => {
                const target = e.target;
                const card = target.closest('.card');
                if (!card) return;
                const idx = parseInt(card.dataset.idx, 10);
                const isVault = card.dataset.vault === 'true';

                if (target.closest('.open-btn')) {
                    window.open(card.dataset.link, '_blank');
                } else if (target.closest('.vault-btn')) {
                    this.toggleFav(idx, isVault);
                } else if (target.closest('.bridge-btn')) {
                    this.copyBridge(card.dataset.network, card.dataset.title);
                }
            });

            this.dom.historyList.addEventListener('click', (e) => {
                const target = e.target.closest('.history-item');
                if (target) {
                    this.dom.queryInput.value = target.dataset.query;
                    this.search();
                }
            });
            
            this.dom.suggestions.addEventListener('mousedown', (e) => {
                 if (e.target.classList.contains('suggest-item')) {
                     this.selectSuggest(e.target.textContent);
                 }
            });
        },

        loadState() {
            try {
                this.state.history = JSON.parse(localStorage.getItem('neon_history') || '[]');
                this.state.favs = JSON.parse(localStorage.getItem('neon_favs') || '[]');
            } catch (e) {
                this.log('CORRUPTED_MEMORY_RECOVERED', 'err');
                this.state.history = [];
                this.state.favs = [];
            }
        },

        saveState() {
            try {
                localStorage.setItem('neon_history', JSON.stringify(this.state.history));
                localStorage.setItem('neon_favs', JSON.stringify(this.state.favs));
            } catch (e) {
                this.log('LOCAL_STORAGE_OVERFLOW_DETECTED', 'err');
            }
        },

        log(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = `log-${type}`;
            const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
            p.textContent = `[${time}] ${msg}`;
            this.dom.console.appendChild(p);
            
            if (this.dom.console.children.length > 50) {
                this.dom.console.removeChild(this.dom.console.firstChild);
            }
            this.dom.console.scrollTop = this.dom.console.scrollHeight;
        },

        updateStats(latency = 0) {
            this.dom.nodeStat.textContent = this.state.results.length;
            this.dom.latStat.textContent = `${latency}ms`;
        },

        startMemMonitor() {
            setInterval(() => {
                const mem = (Math.random() * 20 + 40).toFixed(1);
                this.dom.memStat.textContent = `${mem}MB`;
            }, 3000);
        },

        showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        },

        async search() {
            const query = this.dom.queryInput.value.trim();
            const network = this.dom.networkSelect.value;

            if (!query) return this.log('ERR: VOID_QUERY_DETECTED', 'err');
            if (this.state.isSearching) return;

            this.state.currentQuery = query;
            this.state.currentEngine = network;
            this.state.currentPage = 1;
            this.state.results = [];
            this.state.isSearching = true;
            
            this.toggleLoader(true);
            this.dom.loadMore.classList.add('hidden');
            this.dom.emptyMsg.classList.add('hidden');
            
            const startTime = Date.now();
            this.log(`CHANNELING SCAN: ${network.toUpperCase()} // "${query}"`, 'info');

            try {
                const data = await this.fetchResults(network, query, 1);
                this.state.results = data;
                this.renderGrid(false);
                
                if (data.length === 0) {
                     this.dom.emptyMsg.classList.remove('hidden');
                }
                
                this.toggleLoadMore(data.length === this.config.perPage && this.config.engines[network].pageParam);

                const exists = this.state.history.some(h => h.toLowerCase() === query.toLowerCase());
                if (!exists) {
                    this.state.history.unshift(query);
                    if (this.state.history.length > 30) this.state.history.pop();
                    this.saveState();
                    this.renderHistory();
                }

                const lat = Date.now() - startTime;
                this.updateStats(lat);
                this.log(`SCAN_COMPLETE: ${data.length} NODES FOUND`, 'success');
            } catch (err) {
                this.log(`CATACLYSMIC_FAILURE: ${err.message}`, 'err');
                this.dom.emptyMsg.textContent = "CONNECTION_FAILED";
                this.dom.emptyMsg.classList.remove('hidden');
            } finally {
                this.state.isSearching = false;
                this.toggleLoader(false);
            }
        },

        async loadMore() {
            if (this.state.isSearching || !this.state.currentQuery) return;

            this.state.isSearching = true;
            this.toggleLoader(true);
            const startTime = Date.now();
            this.log(`EXTENDING SCAN TO DEPTH ${this.state.currentPage + 1}...`, 'info');

            try {
                this.state.currentPage++;
                const data = await this.fetchResults(this.state.currentEngine, this.state.currentQuery, this.state.currentPage);
                this.state.results.push(...data);
                this.renderGrid(true); // Append mode
                this.toggleLoadMore(data.length === this.config.perPage);
                
                const lat = Date.now() - startTime;
                this.updateStats(lat);
                this.log(`EXTENSION_COMPLETE: ${data.length} ADDITIONAL NODES CONJURED.`, 'success');
            } catch (err) {
                this.log(`EXTENSION_FAILURE: ${err.message}`, 'err');
                this.state.currentPage--; // Revert page on failure
            } finally {
                this.state.isSearching = false;
                this.toggleLoader(false);
            }
        },

        async fetchResults(engineKey, query, page = 1) {
            const engine = this.config.engines[engineKey];
            if (!engine) throw new Error("ENGINE_LOST_IN_THE_VOID");

            const pageStr = page > 1 ? (engine.pageParam || '') + page : '';
            const url = engine.base + encodeURIComponent(query) + pageStr;
            
            const response = await fetch(this.config.proxy + encodeURIComponent(url));
            if (!response.ok) throw new Error("GATEWAY_TIMEOUT");
            
            const json = await response.json();
            if (!json.contents) throw new Error("EMPTY_RESPONSE");
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(json.contents, 'text/html');
            const items = doc.querySelectorAll(engine.selectors.item);
            
            const results = [];
            const urlObj = new URL(url); // Base URL for resolution

            items.forEach((item, i) => {
                if (i >= this.config.perPage) return;
                try {
                    const titleEl = item.querySelector(engine.selectors.title);
                    const linkEl = item.querySelector(engine.selectors.link);
                    const thumbEl = item.querySelector(engine.selectors.thumb);
                    const durEl = item.querySelector(engine.selectors.duration);

                    if (!titleEl || !linkEl) return;

                    let link = linkEl.getAttribute('href');
                    try {
                        link = new URL(link, urlObj.origin).href;
                    } catch (e) { return; }

                    results.push({
                        title: (titleEl.textContent || titleEl.getAttribute('title') || "UNKNOWN").trim(),
                        link: link,
                        thumb: this.resolveThumb(thumbEl),
                        duration: durEl ? durEl.textContent.trim() : 'LIVE',
                        network: engineKey
                    });
                } catch (e) { /* Skip corrupted node */ }
            });

            return results;
        },

        resolveThumb(img) {
            if (!img) return '';
            
            const candidates = [
                img.getAttribute('data-src'),
                img.getAttribute('data-thumb_url'),
                img.getAttribute('data-mediabook'),
                img.getAttribute('data-poster'),
                img.getAttribute('src')
            ];

            const srcset = img.getAttribute('srcset') || img.getAttribute('data-srcset');
            if (srcset) {
                const parts = srcset.split(',').map(s => s.trim().split(' ')[0]).reverse();
                candidates.unshift(...parts);
            }

            const valid = candidates.find(c => c && (c.startsWith('http') || c.startsWith('//')));
            if (valid) {
                return valid.startsWith('//') ? 'https:' + valid : valid;
            }
            return 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjMGEwYTBmIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiNmZmYiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj9QPC90ZXh0Pjwvc3ZnPg==';
        },

        escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        },

        renderGrid(append = false) {
            if (!append) this.dom.mainGrid.innerHTML = '';
            
            if (this.state.results.length === 0 && !append) {
                this.dom.emptyMsg.classList.remove('hidden');
                return;
            }
            
            this.dom.emptyMsg.classList.add('hidden');
            
            const fragment = document.createDocumentFragment();
            const startIdx = append ? this.state.results.length - this.config.perPage : 0;
            
            this.state.results.slice(startIdx).forEach((item, idx) => {
                const realIdx = startIdx + idx;
                const isFav = this.state.favs.some(f => f.link === item.link);
                const safeTitle = this.escapeHtml(item.title);
                
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.idx = realIdx;
                card.dataset.vault = "false";
                card.dataset.link = item.link;
                card.dataset.network = item.network;
                card.dataset.title = safeTitle;

                card.innerHTML = `
                    <div class="thumb-box">
                        <img src="${item.thumb}" loading="lazy" alt="${safeTitle}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjMGEwYTBmIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiNmZjMxMzEiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj48L3RleHQ+PC9zdmc+'">
                        <div class="tag">${item.network.toUpperCase()}</div>
                        <div class="duration">${item.duration}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title" title="${safeTitle}">${safeTitle}</div>
                        <div class="card-footer">
                            <button class="open-btn">OPEN_NODE</button>
                            <button class="vault-btn ${isFav ? 'active' : ''}" style="${isFav ? 'background:var(--neon-pink); color:#000;' : ''}">
                                ${isFav ? 'SECURED' : 'VAULT'}
                            </button>
                            <button class="bridge-btn">BRIDGE</button>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            
            this.dom.mainGrid.appendChild(fragment);
            this.updateStats();
        },

        toggleFav(idx) {
            const item = this.state.results[idx];
            if (!item) return;

            const existingIdx = this.state.favs.findIndex(f => f.link === item.link);

            if (existingIdx > -1) {
                this.state.favs.splice(existingIdx, 1);
                this.log('NODE_RELEASED_FROM_VAULT', 'warn');
                this.showToast('Node Released');
            } else {
                this.state.favs.push(item);
                this.log('NODE_BOUND_TO_THE_VAULT', 'success');
                this.showToast('Node Secured');
            }

            this.saveState();
            this.renderGrid(false); // Re-render to update button states
            this.renderFavs();
        },

        renderFavs() {
            const container = this.dom.favsGrid;
            if (this.state.favs.length === 0) {
                container.innerHTML = '<div class="status-msg">VAULT LIES EMPTY IN THE SHADOWS.</div>';
                return;
            }
            
            container.innerHTML = this.state.favs.map((item, idx) => {
                const isFav = true; 
                const safeTitle = this.escapeHtml(item.title);
                return `
                <div class="card" data-idx="${idx}" data-vault="true" data-link="${item.link}" data-network="${item.network}" data-title="${safeTitle}">
                    <div class="thumb-box">
                        <img src="${item.thumb}" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjMGEwYTBmIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IiNmZjMxMzEiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj48L3RleHQ+PC9zdmc+'">
                        <div class="tag">${item.network.toUpperCase()}</div>
                        <div class="duration">${item.duration}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title" title="${safeTitle}">${safeTitle}</div>
                        <div class="card-footer">
                            <button class="open-btn">OPEN_NODE</button>
                            <button class="vault-btn pink" style="background:var(--neon-pink); color:#000;">RELEASE</button>
                            <button class="bridge-btn">BRIDGE</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        },

        renderHistory() {
            const container = this.dom.historyList;
            if (this.state.history.length === 0) {
                container.innerHTML = '<div class="status-msg">NO ECHOES LINGER IN THE HISTORY VOID.</div>';
                return;
            }
            container.innerHTML = this.state.history.map(q => `
                <div class="history-item" data-query="${this.escapeHtml(q)}" style="background: var(--surface-alt); padding: 15px; border-left: 3px solid var(--accent); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <span style="font-family: var(--font-mono)">> ${this.escapeHtml(q)}</span>
                    <button class="pink" style="pointer-events: none;">REVOKE</button>
                </div>
            `).join('');
        },

        showSuggestions(val) {
            if (!val) {
                this.dom.suggestions.classList.add('hidden');
                return;
            }
            const matches = this.state.history.filter(h => h.toLowerCase().includes(val.toLowerCase())).slice(0, 5);
            if (matches.length === 0) {
                this.dom.suggestions.classList.add('hidden');
                return;
            }
            this.dom.suggestions.innerHTML = matches.map(m => `
                <div class="suggest-item">${this.escapeHtml(m)}</div>
            `).join('');
            this.dom.suggestions.classList.remove('hidden');
        },

        selectSuggest(q) {
            this.dom.queryInput.value = q;
            this.dom.suggestions.classList.add('hidden');
            this.search();
        },

        copyBridge(engine, title) {
            const cmd = `python3 vidd.py "${title.replace(/"/g, '\\"')}" -e ${engine}`;
            navigator.clipboard.writeText(cmd).then(() => {
                this.log('BRIDGE_INCANTATION_ETCHED', 'info');
                this.showToast('Bridge Command Copied!');
            }).catch(err => {
                this.log('CLIPBOARD_SPELL_FAILED', 'err');
            });
        },

        setTab(view, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            ['grid', 'history', 'favs'].forEach(v => {
                const viewEl = document.getElementById(`${v}-view`);
                if (viewEl) {
                    viewEl.classList.toggle('hidden', v !== view);
                }
            });
            
            if (view === 'favs') this.renderFavs();
            if (view === 'history') this.renderHistory();
        },

        toggleLoader(show) {
            this.dom.loader.classList.toggle('hidden', !show);
            this.dom.mainGrid.style.opacity = show ? '0.3' : '1';
            this.dom.searchBtn.disabled = show;
            this.dom.searchBtn.textContent = show ? 'SCANNING...' : 'INITIALIZE SCAN';
        },

        toggleLoadMore(show) {
            this.dom.loadMore.classList.toggle('hidden', !show);
        },

        clear() {
            this.state.results = [];
            this.dom.mainGrid.innerHTML = '';
            this.dom.emptyMsg.classList.remove('hidden');
            this.toggleLoadMore(false);
            this.dom.queryInput.value = '';
            this.updateStats();
            this.log('GRID_PURGED.', 'warn');
        },

        clearHistory() {
            this.state.history = [];
            this.saveState();
            this.renderHistory();
            this.log('HISTORY_OBLITERATED.', 'warn');
            this.showToast('History Obliterated');
        },

        clearFavs() {
            this.state.favs = [];
            this.saveState();
            this.renderFavs();
            this.log('VAULT_EMPTIED.', 'warn');
            this.showToast('Vault Emptied');
        }
    };

    document.addEventListener('DOMContentLoaded', () => Core.init());
</script>
</body>
</html>
